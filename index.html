<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync Status Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { transition: background-color 0.5s ease; color: white; overflow: hidden; }
        .available { background-color: #064e3b; } /* Deep Green */
        .busy-talkable { background-color: #78350f; } /* Deep Amber */
        .dnd { background-color: #7f1d1d; } /* Deep Red */
        
        .glass-panel { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Matching your blink requests for the UI */
        .blink-fast { animation: pulse 0.4s infinite; }
        .blink-slow { animation: pulse 1.6s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 available" id="bg">

    <div class="glass-panel max-w-sm w-full p-8 rounded-[2.5rem] text-center shadow-2xl">
        <h1 id="status-text" class="text-4xl font-black tracking-tighter mb-2 uppercase">Available</h1>
        <p id="sub-text" class="text-sm opacity-70 mb-8 font-medium">Synced with LED Hardware</p>

        <div class="grid gap-4">
            <button onclick="changeStatus('available')" class="py-4 rounded-2xl bg-white/10 hover:bg-white/20 font-bold border border-white/10">Green (Solid)</button>
            <button onclick="changeStatus('busy-talkable')" class="py-4 rounded-2xl bg-white/10 hover:bg-white/20 font-bold border border-white/10">Yellow (Fast Blink)</button>
            <button onclick="changeStatus('dnd')" class="py-4 rounded-2xl bg-white/10 hover:bg-white/20 font-bold border border-white/10">Red (Slow Blink)</button>
        </div>
    </div>

    <script>
        const IP = "YOUR_PI_IP_ADDRESS"; // <-- CHANGE THIS to your Raspberry Pi's IP
        const statusText = document.getElementById('status-text');
        const subText = document.getElementById('sub-text');
        const bg = document.getElementById('bg');

        // 1. Function to SEND status (Remote Mode)
        async function changeStatus(newStatus) {
            try {
                await fetch(`http://${IP}:5000/set_led`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
            } catch (e) { console.error("Update failed"); }
        }

        // 2. Function to SYNC status (Display Mode)
        async function syncStatus() {
            try {
                const res = await fetch(`http://${IP}:5000/get_status`);
                const data = await res.json();
                updateUI(data.status);
            } catch (e) { subText.innerText = "Connecting to Hub..."; }
        }

        function updateUI(status) {
            // Update Background and Text
            bg.className = `min-h-screen flex items-center justify-center p-6 ${status}`;
            statusText.className = "text-4xl font-black tracking-tighter mb-2 uppercase";
            
            if(status === 'available') {
                statusText.innerText = "Available";
                subText.innerText = "Come on in";
            } else if(status === 'busy-talkable') {
                statusText.innerText = "Busy";
                statusText.classList.add('blink-fast');
                subText.innerText = "Only if urgent";
            } else if(status === 'dnd') {
                statusText.innerText = "Do Not Disturb";
                statusText.classList.add('blink-slow');
                subText.innerText = "Deep Focus Mode";
            }
        }

        // Check for updates every 1 second
        setInterval(syncStatus, 1000);
    </script>
</body>
</html>
